# 发布工作流：推送 v* 标签时为 Android 与 macOS 生成更新包，并写入 GitHub Release。
#
# 需要配置的仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY        ~/.tauri/xiaoman-updater.key 的内容
#   XIAOMAN_OAUTH_ENC                base64(desktop/src-tauri/oauth.enc)
#   ANDROID_KEYSTORE_BASE64          replica.keystore 的 base64
#   ANDROID_KEYSTORE_PASSWORD        keystore 口令
#   ANDROID_KEY_PASSWORD             key 口令
#   ANDROID_KEY_ALIAS                默认 replica
#   XIAOMAN_ANDROID_GOOGLE_CLIENT_ID （可选，Android Google 登录）
#
# 发布前记得提升 apps/android/app/build.gradle 的 versionCode/versionName、
# desktop/src-tauri/tauri.conf.json 的 version，并让 tag（v1.0.1）与 versionName 一致。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-darwin

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Inject OAuth credentials
        env:
          OAUTH_ENC: ${{ secrets.XIAOMAN_OAUTH_ENC }}
        run: |
          if [ -n "$OAUTH_ENC" ]; then
            python3 -c 'import base64,os,sys; open("desktop/src-tauri/oauth.enc","wb").write(base64.b64decode(os.environ["OAUTH_ENC"]))'
          else
            echo -n "" > desktop/src-tauri/oauth.enc
            echo "XIAOMAN_OAUTH_ENC not set; cloud sync disabled in this build"
          fi

      - name: Build desktop bundle
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx --yes @tauri-apps/cli@2.12.6 build --target aarch64-apple-darwin

      - name: Prepare release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, pathlib, shutil
          bundle = "desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          out = pathlib.Path("dist"); out.mkdir(exist_ok=True)
          tgz = glob.glob(f"{bundle}/macos/*.app.tar.gz")[0]
          dmg = glob.glob(f"{bundle}/dmg/*.dmg")[0]
          shutil.copy(tgz, out / "xiaoman-desktop-aarch64.app.tar.gz")
          shutil.copy(tgz + ".sig", out / "xiaoman-desktop-aarch64.app.tar.gz.sig")
          shutil.copy(dmg, out / "xiaoman-desktop-aarch64.dmg")
          tag = os.environ["TAG"]
          version = json.load(open("desktop/src-tauri/tauri.conf.json"))["version"]
          signature = open(tgz + ".sig").read().strip()
          manifest = {
              "version": version,
              "notes": f"见 GitHub Release {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": signature,
                      "url": f"https://github.com/HanYunChenLuo/xiaoman/releases/download/{tag}/xiaoman-desktop-aarch64.app.tar.gz",
                  }
              },
          }
          json.dump(manifest, open(out / "latest.json", "w"), ensure_ascii=False, indent=2)
          print(manifest)
          PY

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "小满 $TAG" --notes "见仓库提交记录与更新说明。"
          for a in app-release.apk _1.0.0_aarch64.dmg _aarch64.app.tar.gz _aarch64.app.tar.gz.sig; do
            gh release delete-asset "$TAG" "$a" --yes >/dev/null 2>&1 || true
          done
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --title "小满 $TAG"

  android:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;30.0.16248370"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare signing and OAuth config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_ID: ${{ secrets.XIAOMAN_ANDROID_GOOGLE_CLIENT_ID }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > apps/android/replica.keystore
          cat > apps/android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          signing.storePassword=$STORE_PASS
          signing.keyPassword=$KEY_PASS
          signing.keyAlias=${KEY_ALIAS:-replica}
          oauth.google.clientId=$GOOGLE_ID
          EOF

      - name: Build APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk xiaoman-android.apk
          gh release upload "$TAG" xiaoman-android.apk --clobber
