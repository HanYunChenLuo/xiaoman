[package]
name = "xiaoman-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native"] }
xiaoman-core = { path = "../../core" }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
open = "5"
