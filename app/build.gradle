plugins {
    id 'com.android.application'
}

def keystore = rootProject.file('replica.keystore')
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def storePass = localProps.getProperty('signing.storePassword')
def keyPass = localProps.getProperty('signing.keyPassword')
def keyAliasName = localProps.getProperty('signing.keyAlias', 'replica')
def signingReady = keystore.exists() && storePass && keyPass

android {
    namespace 'com.xiaoman.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xiaoman.app'
        minSdk 24
        targetSdk 34
        versionCode 40
        versionName '1.6.0'
    }

    if (signingReady) {
        signingConfigs {
            release {
                storeFile keystore
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.release
        }
        debug {
            if (signingReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register('syncBrandData', Copy) {
    from rootProject.file('data/brands.json')
    into layout.projectDirectory.dir('src/main/assets/brands')
}
preBuild.dependsOn syncBrandData
